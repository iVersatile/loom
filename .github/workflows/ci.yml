# CI invokes the SAME `make` targets the local pre-commit hook does, so the gate
# cannot drift between a developer's machine and CI (RULES §7). The blocking core
# is `make gate`; the docker-backed e2e tier is `make gate-integration`, which
# pulls the base image from the ghcr mirror to avoid Docker Hub rate limits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install gate tools
        run: make tools
      - name: Gate (format, vet, lint, spec-conformance, unit tests, secrets)
        run: make gate

  # Mirror the multi-arch base image to ghcr (manifest copy preserves the
  # manifest-list digest). Keeps integration pulls off Docker Hub's rate limit.
  mirror-base:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Lowercase owner (ghcr requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror debian:bookworm-slim -> ghcr
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/loom-base:bookworm-slim" \
            debian:bookworm-slim

  integration:
    runs-on: ubuntu-latest
    needs: [gate, mirror-base]
    permissions:
      # A job-level permissions block REPLACES the top-level default, so contents
      # must be re-granted here or actions/checkout 404s ("Repository not found").
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Integration gate (docker-backed e2e, ghcr base)
        env:
          LOOM_BASE_IMAGE: ghcr.io/${{ env.OWNER }}/loom-base:bookworm-slim
        run: make gate-integration

  # Advisory, non-blocking layer (RULES §7): adversarial review + security review
  # land here in a later phase; kept out of the blocking gate by design.
