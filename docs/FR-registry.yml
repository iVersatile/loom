# Loom FR registry — a machine-readable projection of the specs (ADR-0013).
#
# spec -> FR -> test. The specs are authoritative (SPEC-verbs, SPEC-playbook, and
# the AI-first invariants in RULES §5 / ADR-0005); every FR is an atomic, testable
# assertion extracted from a spec clause. FRs are authored (human, or agent with
# review), never auto-generated from spec text. This registry never originates a
# requirement not grounded in a spec clause.
#
# FORMAT (locked by ADR-0013):
#   meta.version    : registry schema version
#   requirements[]  : one entry per FR
#     id        : stable ID — FR-<AREA>-NNN (behavioral/schema), FR-INV-NNN
#                 (invariant), FR-GUARD-<HOOK> (guardrail)
#     kind      : behavioral | invariant | guardrail | schema
#     statement : the atomic, testable assertion (one pass/fail behavior)
#     source    : spec section citation(s) — the FR->spec joint verify checks
#     tests     : coverage link — shape depends on kind (see below)
#     status    : active | superseded
#                 Coverage is AUTOMATED-ONLY (ADR-0013): no `manual`, no `waiver`.
#                 Human testing is feedback, never an FR's coverage; an un-automatable
#                 behavior is reclassified (automatable proxy, or downgraded to
#                 advisory), not waived.
#
# COVERAGE BY KIND (the FR->test joint verify enforces):
#   behavioral : tests: [<test>, ...]                         # >=1 passing test
#   invariant  : tests: { suite: <parametrized suite>,        # ONE suite, not N files
#                         covers: [<verb>, ...] }              # must exercise each verb
#   guardrail  : tests: { suite: <hook suite>, patterns: all } # the hook's FULL pattern set
#   schema     : tests: [<test>, ...]                         # one FR per merge/resolution rule
#
# SPLIT TRIGGER: move to docs/FR/<area>.yml (verbs | invariants | guardrails |
# schema) only when this single file becomes unwieldy (ADR-0013).
#
# TEMPLATE SHAPES (illustrative — NOT real FRs; Phase-1 seeding adds the real set):
#   - id: FR-BUILD-004
#     kind: behavioral
#     statement: build re-provisions a drifted/under-provisioned container (presence != convergence).
#     source: SPEC-verbs.md#build              # ADR-0011
#     tests: [engine.TestE2EBuildAndSurviveRebuild]
#     status: active
#   - id: FR-INV-001
#     kind: invariant
#     statement: every mutating verb is idempotent — re-running converges; correct items are no-ops.
#     source: RULES.md#§5
#     tests: { suite: engine.TestMutatingVerbsIdempotent, covers: [build, update, teardown] }
#     status: active
#   - id: FR-GUARD-PROTECT-PATHS
#     kind: guardrail
#     statement: protect-paths blocks staged changes to frozen contracts absent an audited override.
#     source: [RULES.md#§2, config/hooks/protect-paths]
#     tests: { suite: guard.TestProtectPaths*, patterns: all }
#     status: active

meta:
  version: 1
  spec_sources: [docs/SPEC-verbs.md, docs/SPEC-playbook.md, docs/RULES.md]

# Phase-1 seed (the one-time bootstrap retrofit, ADR-0013). Each FR is extracted
# from a frozen Phase-1 spec clause and links a passing test. `gap: ...` marks an
# FR whose suite is being added in this same seed PR (verify reports it uncovered
# until linked).
requirements:

  # --- Behavioral: detect (SPEC-verbs#detect) ---
  - id: FR-DETECT-001
    kind: behavioral
    statement: detect is read-only and emits --json with keys tools, agents, credentials, projects, drift.
    source: SPEC-verbs.md#detect
    tests: [cli.TestDetectJSONContract, engine.TestDetectJSONKeys]
    status: active
  - id: FR-DETECT-002
    kind: behavioral
    statement: detect computes per-tool drift (want vs have).
    source: SPEC-verbs.md#detect
    tests: [engine.TestDetectComputesDrift]
    status: active

  # --- Behavioral: plan (SPEC-verbs#plan) ---
  - id: FR-PLAN-001
    kind: behavioral
    statement: plan never mutates; exits 2 on drift, 0 when converged.
    source: SPEC-verbs.md#plan
    tests: [engine.TestPlanDriftAndConverged, cli.TestPlanEmitsJSONAndExitCode]
    status: active
  - id: FR-PLAN-002
    kind: behavioral
    statement: plan emits a --json state document (the diff).
    source: SPEC-verbs.md#plan
    tests: [engine.TestPlanChanged, cli.TestPlanEmitsJSONAndExitCode]
    status: active
  - id: FR-PLAN-003
    kind: behavioral
    # LL-012 (guided-run finding ⑦): plan graded the host while build
    # converged the container — verdict and action must share a domain.
    # Phase-1 review F2 widened the rule from "domain" to "dimensions":
    # plan graded container+tools only while build also converged the
    # lockfile, the staged $HOME, and the agent set.
    statement: plan grades EVERY dimension build converges — container+tools and the agent set (live probe when running, the lock's container-pinned resolved values when stopped, never starting it; with no container every declared tool and agent is an install), the lockfile (the same resolve + carry-forward path build runs, compared content-equal), the staged $HOME (read-only dry run against the config source), and the running container's home-sync sentinel; the build host's PATH is never consulted.
    source: SPEC-verbs.md#plan
    tests: [engine.TestPlanGradesContainerNotHost, engine.TestPlanStoppedContainerUsesLock, engine.TestPlanDriftAndConverged, engine.TestPlanGradesLockfileAndHomeDimensions, engine.TestPlanGradesAgentDimension, engine.TestPlanGradesHomeSyncDimension]
    status: active

  # --- Behavioral: build (SPEC-verbs#build) ---
  - id: FR-BUILD-001
    kind: behavioral
    statement: build resolves intent then writes loom.lock with resolved pins.
    source: SPEC-verbs.md#build
    tests: [engine.TestBuildWritesLockMaterializesAndAudits]
    status: active
  - id: FR-BUILD-002
    kind: behavioral
    statement: build materializes $HOME dotfiles that survive a rebuild.
    source: SPEC-verbs.md#build
    tests: [engine.TestE2EBuildAndSurviveRebuild]
    status: active
  - id: FR-BUILD-003
    kind: behavioral
    statement: build pins the base image by manifest-list digest.
    source: SPEC-verbs.md#build
    tests: [engine.TestBuildPinsBaseDigest]
    status: active
  - id: FR-BUILD-004
    kind: behavioral
    statement: build reconciles an under-provisioned or drifted container (presence is not convergence, ADR-0011).
    source: SPEC-verbs.md#build
    tests: [engine.TestProvisionSentinelMatchesDigest, engine.TestNeedsReprovision, engine.TestE2EBuildAndSurviveRebuild, engine.TestHomeDigestDetectsDotfileChange, engine.TestNeedsHomeSync, engine.TestE2EDotfileChangeConverges]
    status: active
  - id: FR-BUILD-005
    kind: behavioral
    statement: build is recoverable; lock and materialize persist even if the container step fails.
    source: SPEC-verbs.md#build
    tests: [engine.TestBuildContainerErrorAfterLock]
    status: active
  - id: FR-BUILD-006
    kind: behavioral
    statement: build installs declared agents during provision, and the provision sentinel digest covers the agent set (adding/removing an agent re-provisions an existing container).
    source: [SPEC-playbook.md#base-playbook, SPEC-verbs.md#build]
    tests: [engine.TestProvisionScriptInstallsAgent, engine.TestProvisionDigestCoversAgents, engine.TestAgentInstalls]
    status: active
  - id: FR-BUILD-007
    kind: behavioral
    statement: the lock's resolved versions are probed inside the built container, never the build host; a binary the container lacks stays empty.
    source: [SPEC-playbook.md#frozen-decisions, SPEC-verbs.md#build]
    tests: [engine.TestBuildLockRecordsContainerVersions]
    status: active
  - id: FR-BUILD-008
    kind: behavioral
    # Clean-machine proxy for Phase-1 exit criterion 1 (T1 doctrine: the
    # guided-run EXPERIENCE is human feedback, never coverage; the mechanism is
    # the FR). The bootstrap-entry aspect (loom-bootstrap.sh first touch) has no
    # spec clause to cite and is deliberately NOT stretched onto #build — it
    # awaits a human-authored clause (C3).
    statement: from a verified-absent start (no project container, no loom.lock), one unattended build converges to a working env — container present, lock written, declared tools resolvable on the provisioned login PATH.
    source: SPEC-verbs.md#build
    tests: [engine.TestE2EBuildAndSurviveRebuild]
    status: active

  # --- Behavioral: entry bootstrap (SPEC-verbs#entry: bootstrap, accepted #64) ---
  - id: FR-ENTRY-001
    kind: behavioral
    statement: an existing executable at LOOM_BIN (default bin/loom) is exec'd as-is — no rebuild, no mutation.
    source: SPEC-verbs.md#entry:-bootstrap
    tests: [bootstrap.TestBootstrapExecsExistingBinary]
    status: active
  - id: FR-ENTRY-002
    kind: behavioral
    statement: with no binary present and a Go toolchain on PATH, bootstrap builds ./cmd/loom to bin/loom and execs the result (spec envelope is Go >=1.26; the script trusts the toolchain present).
    source: SPEC-verbs.md#entry:-bootstrap
    tests: [bootstrap.TestBootstrapBuildsViaGoWhenAbsent]
    status: active
  - id: FR-ENTRY-003
    kind: behavioral
    statement: with no binary and no Go, bootstrap emits exactly one stderr line naming BOTH remedies (install Go >=1.26 | prebuilt at bin/loom or LOOM_BIN) and exits 1.
    source: SPEC-verbs.md#entry:-bootstrap
    tests: [bootstrap.TestBootstrapFailsNamingBothRemedies]
    status: active
  - id: FR-ENTRY-004
    kind: behavioral
    # Automatable proxy (ADR-0013): static scan for fetch tooling/URLs in the
    # script + FR-ENTRY-002's shim log proving `go build` is the only external
    # invocation on the build path. Frozen network-free until the T20-gated
    # amendment (SPEC-verbs entry clause, future amendment b).
    statement: bootstrap performs no network access — no fetch tooling is invoked and no URL is embedded, on any path.
    source: SPEC-verbs.md#entry:-bootstrap
    tests: [bootstrap.TestBootstrapInvokesNoNetworkTooling]
    status: active

  # --- Behavioral/schema: harness (SPEC-playbook#harness, ADR-0015, clause #53) ---
  - id: FR-BUILD-009
    kind: behavioral
    statement: build materializes declared harness artifacts into the agent home via write-if-changed — settings whole-file, hooks executable under hooks/, skills recursive under skills/ — idempotent, and a dangling reference is a loud error naming agent+field+ref.
    source: [SPEC-playbook.md#harness, SPEC-verbs.md#build]
    tests: [engine.TestMaterializeHarnessArtifacts, engine.TestMaterializeHarnessIdempotent, engine.TestMaterializeHarnessMissingRefErrors, engine.TestDogfoodBasePlaybookHarnessMaterializes]
    status: active
  - id: FR-BUILD-010
    kind: behavioral
    # Phase-1 review C1, git-side half: branch-guard/protect-paths reach a
    # repo only through core.hooksPath; a project shipping .githooks with the
    # config unset runs zero commit-time guards.
    statement: build converges repo-local core.hooksPath=.githooks when the project ships a .githooks dir (audited as githooks.wire; idempotent — a wired repo re-audits nothing); a project without .githooks or .git is a silent skip, never an error.
    source: SPEC-verbs.md#build
    tests: [engine.TestBuildWiresGithooks, engine.TestBuildSkipsGithooksWhenAbsent]
    status: active
  - id: FR-BUILD-011
    kind: behavioral
    # T4 (decided 2026-06-11): one dotfile dir owns shell config. The loader
    # is wired unconditionally (never gated on the tool set); known PATH
    # entries are engine-generated dotfiles emitting $HOME, and the provision
    # script never appends to shell-init files.
    statement: shell config has one declarative owner — build wires both .profile and .bashrc to source ~/.bashrc.d/*.sh unconditionally; stack/agent PATH entries materialize as generated $HOME-based dotfiles in that dir (graded by plan/doctor like declared dotfiles); the provision script touches no shell-init file.
    source: SPEC-playbook.md#shell-config-model
    tests: [engine.TestShellInitWiresBothShells, engine.TestPathDotfilesSingleOwner, engine.TestProvisionScriptCoversSources, engine.TestPlanGradesGeneratedPathDotfile]
    status: active
  - id: FR-BUILD-012
    kind: behavioral
    # Live-build e2e R1 family (F-a/F-b/F-c): a third party must be able to
    # reconstruct what a build changed AFTER the fact — summary counts writes,
    # the bulk home sync is one named audit entry, diag logs accumulate runs.
    statement: build observability is reconstruction-grade — the human summary splits ensured/written; a home sync into the container appends one home.sync audit entry naming the shipped file set (no-op runs append nothing); per-verb diagnostic logs append run-demarcated, never truncate.
    source: SPEC-verbs.md#build
    tests: [engine.TestBuildSummaryCountsWrites, engine.TestBuildAuditsHomeSync, engine.TestDiagLogAppendsAcrossRuns]
    status: active
  - id: FR-BUILD-013
    kind: behavioral
    # T16 PR 3: git identity is declared config (ADR-0015), shipped as a plain
    # dotfiles: reference — no new schema field (SPEC-playbook#harness).
    statement: the `gitconfig` dotfile reference (named, not hidden, in the config source) materializes to ~/.gitconfig through the standard staging pipeline, re-converged every build like any declared dotfile.
    source: SPEC-playbook.md#harness
    tests: [engine.TestGitconfigMapsToHomeDotfile]
    status: active
  - id: FR-BUILD-014
    kind: behavioral
    # 036 ruling ("2-plus", human-decided 2026-06-12, ADR-0018): the harness
    # trust/opt-in file is an overlay SIBLING of the agent home — it dies on
    # container recreate; build re-materializing it from the declared ref is
    # what makes the opt-in durable (zero manual re-flips after recreate).
    statement: build materializes harness.<agent>.trust whole-file to $HOME/.<agent>.json — a sibling of the agent home, never inside it — via write-if-changed; a dangling reference is a loud error naming agent+field+ref; staged-home drift grades the same surface.
    source: SPEC-playbook.md#harness
    tests: [engine.TestMaterializeHarnessTrustFlags, engine.TestDogfoodProjectPlaybookTrustMaterializes]
    status: active
  - id: FR-BUILD-015
    kind: behavioral
    # T10 PR 3 (Model A, ADR-0019): make the resolved user real at runtime. The
    # container runs as root (no `docker run --user`); the user is created at
    # provision and entry verbs run as it (FR-EXEC-004). Docker-side behavior is
    # integration-validated (T1: the real container path is CI-only); the unit
    # tests pin the automatable proxies — the run-args, the provision/chown
    # scripts, the home resolution.
    statement: for a non-root `user:`, build creates the user at provision (idempotent; uid 1000 preferred-when-free, next-free + logged on collision, never a hard pin or a foreign-account adoption), targets every home materialization at the resolved $HOME (/home/<user>), and chowns the synced tree to the user while pruning the read-only credentials bind (no blanket chown -R); the container runs as root with no `--user`. Unset/root is byte-identical to pre-T10 builds.
    source: [SPEC-playbook.md#user, SPEC-verbs.md#build]
    tests: [engine.TestProvisionUserScript, engine.TestChownHomeScript, engine.TestCreateRunArgs, engine.TestHomeForUserResolution, engine.TestHomeCpTargetSingleOwner]
    status: active
  - id: FR-BUILD-016
    kind: behavioral
    # ADR-0019 PR4 §5 (LL-014 REDO of Part 1): the role marker is produced the
    # loom way — sourced from the DECLARATIVE playbook role: field (LOOM_SESSION_ROLE
    # demoted to an override/test-seam), folded into the convergence digest so a
    # missing/stale marker self-heals on a plain build, and fail-loud instead of a
    # silent no-op on an empty role. Readies the marker-file role resolution the
    # drain-guard adopts after the HUMAN Part-2 swap (replacing the forgeable
    # id -un==root guess; ADR-0022 S3). The docker-side write/read is integration-
    # validated (CI); unit tests pin the script + plumbing + convergence + fail-loud
    # + doctor proxies.
    statement: build sources the role from the declarative playbook role: field (LOOM_SESSION_ROLE overrides when set; marker-safe charset only) and writes it to a ROOT-OWNED single-line /var/lib/loom/role marker a non-root agent can read but not forge; the marker is a convergence dimension (a missing/stale marker rewrites on the next plain build, mirroring the home sentinel); the fail-loud keys on the role alone, never the user — an UNdeclared role surfaces a visible warning and writes no marker (any user, byte-identical build otherwise) while a DECLARED-but-malformed role is a hard build error; doctor surfaces the container:user model (root under Model A, the configured non-root user named as the entry-verb exec identity).
    source: [SPEC-playbook.md#role, SPEC-verbs.md#build, SPEC-verbs.md#doctor]
    tests: [engine.TestValidRole, engine.TestRoleMarkerScript, engine.TestNeedsRoleMarker, engine.TestRoleMarkerPlan, engine.TestBuildPopulatesRole, engine.TestBuildRoleLoudFail, engine.TestDoctorContainerUser]
    status: active
  - id: FR-SCHEMA-008
    kind: schema
    # T16 PR 2: the base-authored rule is enforced at Load per non-base LAYER
    # (authorship), not by tier-checking the merged playbook — the merge
    # legitimately carries the base's settings under the project's tier.
    # Trust (ADR-0018) is deliberately NOT base-restricted: trust posture is
    # project-tier by doctrine (the flags name project paths).
    statement: harness merges per agent namespace — hooks/skills concatenate + dedup in layer order, settings and trust last-non-empty win; Phase 1 rejects a settings declaration on any non-base layer at Load, naming the layer (base-authored whole-file only); trust may be authored by any layer.
    source: SPEC-playbook.md#harness
    tests: [playbook.TestHarnessMergeRules, playbook.TestValidateHarnessSettingsBaseOnly]
    status: active
  - id: FR-SCHEMA-009
    kind: schema
    # T10 PR 2 (ADR-0019): user: is the configured container runtime user. A
    # last-non-empty-wins scalar authored at ANY tier (NOT base-only like
    # settings); unset means root, so every pre-T10 playbook is unchanged. The
    # engine BEHAVIOR (docker run --user, useradd, chown) is PR 3 — this FR
    # covers only the schema/merge/validate + the $HOME resolution (homeForUser)
    # that ContainerSpec.User/Home are plumbed from.
    statement: the optional `user:` scalar merges last-non-empty-wins across any tier (never base-restricted); a set value must be a single token (no whitespace, no / or :), `user: root` permitted; the resolved container $HOME is /root when user is unset or root, else /home/<user>; build populates ContainerSpec.User/Home from the merged value.
    source: SPEC-playbook.md#user
    tests: [playbook.TestUserMergeLastWins, playbook.TestValidateUserFormat, engine.TestHomeForUserResolution, engine.TestBuildPopulatesUserAndHome]
    status: active
  - id: FR-SCHEMA-010
    kind: schema
    # T10 PR 4 §5 (ADR-0019, LL-014): role: is the DECLARATIVE in-tree source for
    # the /var/lib/loom/role marker, replacing the ambient LOOM_SESSION_ROLE env
    # (demoted to an override/test-seam). This FR covers only the schema joint —
    # the optional scalar's merge + single-token validation; the engine BEHAVIOR
    # (marker-safe charset, fail-loud on non-root+empty, convergence write) is
    # FR-BUILD-016. The non-root-user-needs-a-role rule is build-time, not schema.
    statement: the optional `role:` scalar merges last-non-empty-wins across any tier (never base-restricted); a set value must be a single token (no whitespace, no / or :); unset means no role marker is written.
    source: SPEC-playbook.md#role
    tests: [playbook.TestRoleMergeLastWins, playbook.TestValidateRoleFormat]
    status: active
  - id: FR-SCHEMA-011
    kind: schema
    # Slice A / T34 cutover (2026-06-18): roles: is the DECLARATIVE plural sibling
    # to role: — the set loom-dev is provisioned to act as (forward-looking for
    # co-residence). It is declaration-only: it does NOT derive or affect the
    # trust marker (the scalar role: stays the marker default — the C2 fail-closed
    # insight, ADR-0021 §Alternatives). Flipping the marker from the roles ceiling
    # is forbidden until its matched absent-signal floor lands together (Slice D).
    # This FR covers only the schema joint — the plural list's merge + per-entry
    # known-role validation; no engine/marker behavior is added by this slice.
    # Source shares the `role:` field section (#role): the dedicated `roles:`
    # spec subsection is a frozen-contract (SPEC-playbook.md) change requiring
    # human ALLOW_SPEC_CHANGE, deferred out of this ordinary slice (flagged to
    # the advisor). The role family is documented there until that lands.
    statement: a `roles:` list declares the container provisioned role set; each entry a single validated token in {loom-author, loom-advisor}; merges by list concat/dedup; declarative-only (does not affect the trust marker), so a single-`role:` config stays byte-identical.
    source: SPEC-playbook.md#role
    tests: [playbook.TestRolesMergeConcatDedup, playbook.TestValidateRolesDeclaration, playbook.TestSingleRoleConfigByteIdentical]
    status: active
  - id: FR-SCHEMA-012
    kind: schema
    # T20 S2a (ADR-0028): networking: is the optional, any-tier egress posture. The
    # egress: scalar merges last-non-empty-wins (the user: rule); allow: unions
    # across tiers, deduped in layer order (the rules:/dotfiles: rule, so the base
    # load-bearing model-API/VCS entries cannot be dropped by an overlay). This FR
    # covers only the SCHEMA joint — parse/merge/validate. CRITICAL fail-closed: the
    # allowlist MECHANISM (custom network, provision-then-restrict) is S2b — validate
    # rejects egress: allowlist as a HARD error (never a silent degrade to full
    # egress, the exact guardrail hole ADR-0028 closes). The behavioral none→cut
    # mapping is FR-NET-001. S2b will extend this to validate a REALIZED allowlist.
    statement: the optional `networking:` section parses at any tier; `egress:` merges last-non-empty-wins in {"" (=off), off, none, allowlist}; `allow:` is a hostname list unioned + deduped across tiers in layer order; validation requires a non-empty `allow:` for allowlist (an empty deny-by-default posture is a hard error, never a silent degrade) and accepts allowlist with a non-empty allow (the S2b proxy mechanism); none/off/unset are accepted.
    source: SPEC-playbook.md#networking
    tests: [playbook.TestNetworkingMerge, playbook.TestValidateNetworking, playbook.TestParseNetworkingBothTiers]
    status: active

  - id: FR-SCHEMA-013
    kind: schema
    # T20/T28 LOW-2 hardening. The frozen Format decision (parser reads YAML or
    # JSON) was implemented with sigs.k8s.io/yaml's non-strict Unmarshal, which
    # SILENTLY DROPS keys with no struct field. For a security tool that is a real
    # hole: a one-char typo in a security field (`egres:` for `egress:`, `tols:`
    # for `tools:`) parsed cleanly and silently fell back to the permissive default
    # (full egress / no tools). The fix flips the single decode seam (Parse, which
    # ALL of Parse/ParseFile/ParseFS and every tier — base, stack, overlay, project
    # — route through) to UnmarshalStrict (json DisallowUnknownFields), so an
    # unrecognized key is a HARD parse error that NAMES the offending key. Comments
    # and YAML anchors/aliases are resolved by the YAML→JSON step before strict
    # decode and are unaffected; only keys with no declared field are rejected.
    statement: playbook decoding is strict — a key that maps to no declared schema field, or a duplicate top-level key, is rejected at parse with an error that names the offending key (a typo'd or unknown field can never silently parse to a permissive default; a duplicate key can never silently last-wins), applied at the single Parse seam so every tier (base/stack/overlay/project) and both input formats (YAML, JSON) get it; comments and YAML anchors/aliases and all declared optional fields still parse cleanly.
    source: SPEC-playbook.md#frozen-decisions
    tests: [playbook.TestParseRejectsUnknownKey, playbook.TestParseAcceptsKnownGood]
    status: active

  # --- Behavioral: networking / egress (SPEC-playbook#networking, ADR-0028) ---
  # T20 S2a realizes the declarative networking: field + the egress: none posture
  # (reusing the S1 --network none primitive); S2b (ADR-0028 Amendment 1) adds the
  # allowlist MECHANISM — a managed proxy sidecar as the sole route off an internal
  # network. FR-NET-002 covers the resolved allowlist + proxy-env wiring; FR-NET-004
  # covers the doctor confinement claim. All three cite ENGINE-SEAM unit tests
  # (proven without docker); the LIVE container cut + reachability is the integration
  # canary (//go:build integration), which fr-verify cannot see, so it is
  # deliberately NOT cited here (it is the live proof, not the fr-cited test).
  - id: FR-NET-001
    kind: behavioral
    statement: a playbook declaring `networking.egress: none` produces a container with no external egress — build plumbs it to ContainerSpec.NoEgress and createRunArgs appends `--network none` (only loopback, no eth0), doctor-verifiable via `container:egress`; off/unset leave full egress unchanged (the Phase-1 default).
    source: SPEC-playbook.md#networking
    tests: [engine.TestBuildPopulatesNoEgress, engine.TestNoEgressMapping, engine.TestCreateRunArgsNoEgress, engine.TestEgressClaimOK, engine.TestContainerEgressCheckNone, engine.TestContainerEgressCheckOffNoProbe]
    status: active
  - id: FR-NET-002
    kind: behavioral
    # T20 S2b (ADR-0028 Amendment 1): the allowlist MECHANISM. The resolved set is
    # the declared allow: UNIONed with the hardcoded load-bearing floor (model API,
    # credential helpers, VCS) so a deny-by-default posture can never BRICK the agent
    # by a forgotten host; the union is deduped + sorted (deterministic). build maps
    # the posture onto ContainerSpec.Egress; an allowlist container carries
    # HTTP(S)_PROXY pointed at its sidecar (the route off its --internal network is
    # the actual fence; the env is convenience for cooperating clients). The live
    # reachability/bypass proof is the integration canary (NOT fr-cited).
    statement: a playbook declaring `networking.egress: allowlist` confines the container to the resolved allowlist (declared ∪ the load-bearing floor — model API, credential helpers, VCS — which is ALWAYS included so a deny-by-default posture never bricks the agent) via a managed proxy sidecar that is the sole route off the container's internal network; build maps the posture onto ContainerSpec.Egress and points the container's HTTP(S)_PROXY at the sidecar; a direct/raw-socket bypass has no off-box route.
    source: SPEC-playbook.md#networking
    tests: [engine.TestResolveEgressAllowlist, engine.TestEgressPolicyMapping, engine.TestEgressProxyRunEnvArgs]
    status: active
  - id: FR-NET-004
    kind: behavioral
    # T20 S2b (ADR-0028 Amendment 1): doctor mechanizes the allowlist confinement
    # claim. Pure decision (egressAllowlistClaimOK) over read-only probes; fail-closed
    # on an unreadable probe or a missing sidecar (a sidecar-less container on an
    # --internal net has NO route out at all — broken confinement, not safe).
    statement: doctor's `container:egress` claim verifies the allowlist confinement on a running container — it holds iff the container's network set is EXACTLY its internal egress network (no off-box route) and nothing else routable, with the proxy sidecar running; a missing sidecar, a bridge attachment, ANY unexpected additional network (defense-in-depth), an off-internal-net container, or an unreadable probe all FAIL closed (a security claim never greens on a garbage answer).
    source: SPEC-playbook.md#networking
    tests: [engine.TestEgressAllowlistClaimOK]
    status: active

  # --- Credential convention + claude M1/M2 adapters (SPEC-playbook#credential,
  # ADR-0027 slice 1). loom wires the MECHANISM, never the VALUE — every FR below
  # is proven by NON-integration, fr-verify-visible unit tests that use an obvious
  # FAKE-TOKEN through a mockable read-seam (no real secret, gitleaks-clean). The
  # LIVE container token-read + injection is the integration canary (NOT fr-cited).
  - id: FR-CRED-001
    kind: schema
    # The declaration + merge + validate joint. credential is the pointer analogue
    # of trust: any-tier last-non-nil-wins (NOT the base-gated settings path). The
    # adapter enum is FIXED; only apiKeyHelper (M2) + volume-token (M1) are wired in
    # slice 1 — every other member FAILS CLOSED at validate (a declared credential
    # is never silently no-op'd, the guardrail principle).
    statement: `harness.<agent>.credential` parses as {method, helper?, env?}; merges any-tier last-non-nil-wins (like trust, not base-gated); validates the method against the fixed adapter enum (env, apiKeyHelper, volume-token, volume-store+helper, oauth-file, interactive-login) with per-method required fields (apiKeyHelper requires helper, volume-token requires env), and FAILS CLOSED on a known-but-unwired method (slice 2+) or an unknown token — never a silent no-op.
    source: SPEC-playbook.md#credential
    tests: [playbook.TestCredentialMergeAnyTierLastWins, playbook.TestCredentialMergeNilLayerKeepsEarlier, playbook.TestValidateCredentialWiredMethods, playbook.TestValidateCredentialRequiredFields, playbook.TestValidateCredentialFailClosedUnwired, playbook.TestValidateCredentialUnknownMethod]
    status: active
  - id: FR-CRED-002
    kind: behavioral
    # M2: a TARGETED key-set of apiKeyHelper on the materialized settings.json — a
    # declared carve-out (like trust), NOT the deferred general key-merge. The
    # helper is an operator command loom never runs/reads.
    statement: the apiKeyHelper (M2) adapter sets the `apiKeyHelper` key on the already-materialized settings.json via a targeted key-set that preserves every other key (not a whole-file clobber, not a deep merge), idempotently; the helper value is the operator command loom places but never runs or reads; a non-apiKeyHelper build is byte-identical.
    source: SPEC-playbook.md#credential
    tests: [engine.TestSetSettingsKeyTargetedKeySet, engine.TestSetSettingsKeyIdempotent, engine.TestApplyAPIKeyHelperMaterialize, engine.TestApplyAPIKeyHelperNoCredentialNoop]
    status: active
  - id: FR-CRED-003
    kind: behavioral
    # M1: per-project volume mounted at create (leak-safe -v, NOT run -e), token
    # injected at EXEC time as `docker exec -e` on the AGENT seat — the ADR-0014
    # Config.Env/`docker inspect` leak avoided. Fail-closed on absent/empty token.
    statement: the volume-token (M1) adapter mounts a per-project credential volume (`<container>-<agent>-cred`) read-only on `docker run` (a leak-safe -v, NEVER `docker run -e`) and injects the human-provisioned token at exec-time as `docker exec -e <env>=<token>` onto the AGENT seat only — so the value never enters Config.Env/`docker inspect` (the ADR-0014 leak); an absent or empty token FAILS CLOSED (the verb refuses, no unauthenticated seat). The token-read is a mockable seam (tests assert injection via FAKE-TOKEN, no real secret).
    source: SPEC-playbook.md#credential
    tests: [engine.TestCredentialExecEnvInjectsToken, engine.TestCredentialExecEnvFailClosedAbsent, engine.TestCredentialExecEnvFailClosedEmpty, engine.TestCredentialExecEnvNoCredentialNoop, engine.TestCredentialVolumeMountIsVolumeNotRunEnv, engine.TestExecInjectsCredentialOntoAgentSeat, engine.TestExecFailClosedOnAbsentCredential, engine.TestCredentialVolumeName]
    status: active
  - id: FR-CRED-004
    kind: behavioral
    # ADR-0027 invariant #1, mechanically checked: the per-project credential
    # volume key isolates one project's credential from another's; doctor fails
    # closed on a malformed or colliding slug (cross-wiring two projects onto one
    # credential store). Graded only when an M1 credential is declared.
    statement: doctor's `host:credential-slug` claim mechanizes ADR-0027 invariant #1 (slug-uniqueness) — the per-project credential volume key must be a well-formed single token and collision-free across declared agents; a malformed project/agent slug or a key collision FAILS CLOSED (two projects must not cross-wire onto one credential store); the check is graded only when an M1 (volume-token) credential is declared.
    source: SPEC-playbook.md#credential
    tests: [engine.TestCredentialSlugCheckOK, engine.TestCredentialSlugCheckBadSlug, engine.TestCredentialSlugCheckNotApplicable]
    status: active

  # --- Behavioral: exec (SPEC-verbs#exec, ADR-0016) ---
  - id: FR-EXEC-001
    kind: behavioral
    statement: exec requires a command (a bare invocation is a non-zero usage error, never an interactive fallback) and propagates the command's exit code verbatim.
    source: SPEC-verbs.md#exec
    tests: [cli.TestExecRequiresCommand, engine.TestExecRequiresCommand, engine.TestExecPropagatesExitCode, engine.TestE2EExecContract]
    status: active
  - id: FR-EXEC-002
    kind: behavioral
    statement: the exec'd command runs in /workspace/<project> with login-shell environment (provisioned PATH applies); a stopped container is started first, an absent one errors with the loom build hint.
    source: SPEC-verbs.md#exec
    tests: [engine.TestExecTargetsWorkspaceAndStarts, engine.TestExecAbsentContainerErrors, engine.TestE2EExecContract]
    status: active
  - id: FR-EXEC-003
    kind: behavioral
    # Phase-1 review H2: the append was best-effort (silently skipped when
    # the log could not open) — an unaudited agent-facing door.
    statement: every exec appends an action-log entry carrying the command, its exit code, and the entry id — the verb's structured surface (no --json, spec exemption). Fail-closed — an exec whose action log cannot open refuses to run, and a post-run append failure is a loud error, never a silent gap.
    source: SPEC-verbs.md#exec
    tests: [engine.TestExecAuditsCommandAndExit, engine.TestExecRefusesUnauditable]
    status: active
  - id: FR-EXEC-004
    kind: behavioral
    # T10 PR 3 (Model A, ADR-0019 amended): the container runs as root but entry
    # verbs run AS the configured user via `docker exec -u <user>` BY NAME
    # (collision-proof — the name resolves to whatever uid useradd assigned).
    statement: exec and shell run their command as the playbook's resolved `user:` via `docker exec -u <user>` (by name); an unset or `root` user adds no `-u` flag (the container default), so every pre-T10 entry is unchanged.
    source: [SPEC-playbook.md#user, SPEC-verbs.md#exec]
    tests: [engine.TestExecRunsAsConfiguredUser, engine.TestExecUserArgs]
    status: active

  # --- Behavioral: shell (SPEC-verbs#shell) ---
  - id: FR-SHELL-001
    kind: behavioral
    # T1 doctrine: the interactive TTY experience is human feedback, never
    # coverage; the automatable proxy is the mechanism contract below.
    statement: shell opens an interactive login shell through exec's engine path — ONE code path with a TTY option, same lifecycle (stopped starts; absent errors with the build hint; exit code verbatim; no command argument accepted) — and audits exactly one session-open entry that captures no command. Fail-closed — no session-open record possible, no session.
    source: SPEC-verbs.md#shell
    tests: [engine.TestShellUsesExecPathWithTTY, engine.TestShellAuditsSessionOpenNoCommands, engine.TestShellAbsentContainerErrors, engine.TestShellRefusesUnauditable, cli.TestShellRejectsArgs]
    status: active

  # --- Behavioral: teardown (SPEC-verbs#teardown) ---
  - id: FR-TEARDOWN-001
    kind: behavioral
    statement: teardown removes by tier (stop|volumes|reset) and rejects invalid levels; the report names only what was actually removed (Phase 1 creates no per-project data volume, so the volumes tier removes none — never a phantom).
    source: SPEC-verbs.md#teardown
    tests: [engine.TestTeardownRemovesAndAudits, cli.TestTeardownValidLevels, cli.TestTeardownInvalidLevel]
    status: active
  - id: FR-TEARDOWN-004
    kind: behavioral
    # Phase-1 review F1: --clean-state was declared, CLI-wired, and never
    # read; the agent-home volume loom creates was removable by nothing.
    statement: --clean-state removes the agent-home volume (agent auth/memory/logs) and is the ONLY path that does — no tier touches agent state without it; the flag reaches the runtime both ways, never a silent no-op.
    source: SPEC-verbs.md#teardown
    tests: [engine.TestTeardownPassesCleanStateThrough, engine.TestTeardownRemovesAndAudits]
    status: active
  - id: FR-TEARDOWN-002
    kind: behavioral
    statement: the reset/wipe tier requires explicit confirmation.
    source: SPEC-verbs.md#teardown
    tests: [engine.TestWipeProjectRequiresConfirmation, engine.TestWipeProjectWithConfirmation]
    status: active
  - id: FR-TEARDOWN-003
    kind: behavioral
    # Guided-run finding ⑨: teardown ran unprompted on an interactive TTY —
    # the most destructive routine verb must never act on silence.
    statement: teardown acts only on explicit consent — an affirmative answer to its [y/N] prompt, or --yes for automation; on silence (EOF, empty, any other answer) it removes nothing. There is no --force, and --wipe-project's typed confirmation stays non-bypassable by --yes.
    source: SPEC-verbs.md#teardown
    tests: [cli.TestTeardownRequiresConsent, cli.TestTeardownPromptDecides]
    status: active

  # --- Behavioral: doctor (SPEC-verbs#doctor) ---
  - id: FR-DOCTOR-001
    kind: behavioral
    statement: doctor reports environment checks (ok/missing).
    source: SPEC-verbs.md#doctor
    tests: [engine.TestDoctorChecks, engine.TestDoctorMissingTool]
    status: active
  - id: FR-DOCTOR-002
    kind: behavioral
    # Guided-run finding ⑧ (LL-012 class): doctor answered tool checks from
    # the host PATH while exec hit the container — a bill of health must name
    # which environment it grades.
    statement: every doctor check names its tier (host:* repo-side facts, container:* container reality); tool checks grade the CONTAINER — live probe when running, lock-pinned resolved values when stopped (never starting it) — and with no container or no runtime, container:state fails with the reason and no per-tool verdict is invented from the host PATH.
    source: SPEC-verbs.md#doctor
    tests: [engine.TestDoctorChecks, engine.TestDoctorAbsentContainer, engine.TestDoctorStoppedContainerGradesFromLock, engine.TestDoctorRuntimeUnavailable]
    status: active
  - id: FR-DOCTOR-003
    kind: behavioral
    # Phase-1 review C1: guardrails were declared, doctor-verified for
    # presence, and never wired into built containers — green bill of health
    # over zero mechanism-level guardrails. Doctor must grade the wiring
    # chain, not the source tree.
    statement: doctor verifies guardrails are WIRED, not just present — declared harness settings carry a non-empty permissions.deny floor and a registration for every declared harness hook; the staged $HOME matches the config source; a running container's home sentinel matches the staged digest (stopped is graded at the staging tier, never started); and a project shipping .githooks fails the check until core.hooksPath points at it.
    source: SPEC-verbs.md#doctor
    tests: [engine.TestDoctorFailsCosmeticsOnlySettings, engine.TestDoctorPassesGuardedSettings, engine.TestDoctorStagedHomeDrift, engine.TestDoctorContainerHomeWiring, engine.TestDoctorGradesGithooksWiring]
    status: active
  - id: FR-DOCTOR-004
    kind: behavioral
    # T16 PR 3: the materialized ~/.gitconfig is what every in-container
    # commit signs as (TEAM commit-identity rule) — completeness is mechanism;
    # WHICH identity stays repo policy, reviewed at the config-source PR.
    statement: when the playbook ships a gitconfig, doctor's host:gitconfig check fails on a missing or [user]-incomplete declaration and surfaces the declared identity when complete.
    source: SPEC-verbs.md#doctor
    tests: [engine.TestDoctorGradesGitconfigIdentity, engine.TestGitIdentityParsesUserSection]
    status: active
  - id: FR-DOCTOR-005
    kind: behavioral
    # T27 facet B (human drafts 032/033): the AUTOPILOT drain is a Stop hook;
    # a session launched outside the repo root never loads it, so eligible
    # queued work sits undrained and silent (2026-06-12 incident — no
    # .drain-count ever written). Doctor mechanizes the hand-check: what the
    # reviewer caught by hand 6h in, the doctor catches on demand. Side-effect
    # based by design; live-idle detection beyond the first drain needs a
    # heartbeat (T27-B remainder) and is deliberately not faked.
    statement: doctor's host:autopilot check flags the silent-idle anomaly — AUTOPILOT on for the loom-author inbox with one or more eligible QUEUED items but no drain evidence (.drain-count absent) fails, naming the likely never-loaded Stop hook; autopilot off, no queued work, or a drain that has fired pass; a tree with no loom-author inbox is not graded.
    source: SPEC-verbs.md#doctor
    tests: [engine.TestAutopilotDrainLiveness]
    status: active
  - id: FR-DOCTOR-006
    kind: behavioral
    # T10 PR 4 reminder, mechanized: a non-root user: silently breaks the drain
    # role-guard (the id -un==root fallback fail-closes) until PR 4 wires the
    # root-owned /var/lib/loom/role marker. Doctor fires the reminder at exactly
    # the non-root moment, so the deferred patch (docs/patches/0022) can't be
    # forgotten into a silent drain stall.
    statement: doctor's host:role-marker check fails when a non-root user: is configured but the drain-guard still uses the id -un==root fallback (no /var/lib/loom/role wiring) — naming T10 PR 4; passes when the guard reads the marker; not graded for a root/unset user or a tree without the drain hook.
    source: SPEC-verbs.md#doctor
    tests: [engine.TestRoleMarkerReminder]
    status: active

  # --- Behavioral: start (SPEC-verbs#start, T36 / The Run scenario 1) ---
  # The guided bring-up verb: it ORCHESTRATES the existing reconcile verbs (it
  # adds guidance, not new reconcile logic). FRs land in the build PR with their
  # tests + the engine wiring (the house pattern, e.g. FR-BUILD-016). Scenario 2
  # (clean reset + credential carry-forward) is OUT — those ride detect --migrate
  # + ADR-0014/0026 in a later slice.
  - id: FR-RUN-001
    kind: behavioral
    statement: >-
      start reaches a working env by INVOKING the existing reconcile verbs in order —
      detect → (gather minimal inputs) → plan → build — never reimplementing their
      logic; a non-zero result from any sub-verb aborts the run with that sub-verb's
      exit code + error and reports ready:false (no partial "ready").
    source: SPEC-verbs.md#start
    tests: [cli.TestStartOrchestratesDetectPlanBuild, cli.TestStartAbortsOnSubVerbFailure]
    status: active
  - id: FR-RUN-002
    kind: behavioral
    statement: >-
      loom start --non-interactive --json runs to completion with ZERO prompts when
      the required inputs (stack + keys) are supplied via flags/env, emitting the
      documented --json shape (situation, inputs, steps[], ready, next); a required input
      missing in non-interactive mode exits 2 (needs-input), never prompting or hanging.
      start is NOT --json-exempt (unlike exec/shell).
    source: SPEC-verbs.md#start
    tests: [cli.TestStartNonInteractiveJSONShape, cli.TestStartNonInteractiveMissingInputExit2]
    status: active
  - id: FR-RUN-003
    kind: behavioral
    statement: >-
      the only inputs start requires to reach a working env (scenario 1) are the stack
      and the required keys; it solicits no other human input. Interactive mode prompts
      for exactly these; non-interactive mode reads exactly these from flags/env.
    source: SPEC-verbs.md#start
    tests: [cli.TestStartMinimalInputs]
    status: active
  - id: FR-RUN-004
    kind: behavioral
    # Integration-tier (the #75 OOM-flaking tier) — the guided-run e2e. Reuses the
    # FR-BUILD-008 clean-machine proxy approach; the fixture is kept minimal.
    statement: >-
      from a clean machine, ONE start invocation (no restarts) reaches a working env —
      build converged AND a smoke exec in the env succeeds — and start reports
      ready:true ONLY when both hold; otherwise ready:false + non-zero exit.
    source: SPEC-verbs.md#start
    tests: [cli.TestStartOneRunWorkingEnv]
    status: active

  # --- The Run, scenario 2 (continuity / carry-forward) — detect --emit-playbook ---
  # The continuity HALF of scenario 2 (established machine -> carried forward): capture
  # the detected machine as a reviewable draft base playbook (the no-information-loss
  # bridge, SPEC-verbs#detect "Continuity"). Build-to-frozen-spec — the detect clause
  # already specs --emit-playbook, so NO ALLOW_SPEC_CHANGE. The credential-MOVE half
  # (--migrate consolidating values into .env) is a SEPARATE, security-sensitive slice
  # (ADR-0014 leak thesis) — names are carried here, values never.
  - id: FR-RUN-005
    kind: behavioral
    statement: >-
      detect --emit-playbook writes a draft BASE playbook representing the detected
      machine — present tools (each as a name@version intent when a clean version
      token is recoverable from the prober line, else the bare name), present agents,
      and detected credential NAMES as env: (names only; never values, never their
      found-in locations) — which re-parses and validates as a base-tier playbook. It
      writes a DISTINCT draft file (loom.base.draft.yml), never overwriting the
      canonical loom.yml, surfaces the written path on stderr (both human and --json
      modes, so a --json agent can find it), and leaves detect's frozen --json
      document unchanged.
    source: SPEC-verbs.md#detect
    tests: [engine.TestEmitDraftPlaybookRoundTrips, engine.TestEmitDraftPlaybookNamesOnlyNoValues, engine.TestEmitDraftPlaybookVersionBestEffort, engine.TestDetectNoEmitUnchanged, cli.TestDetectEmitPlaybookJSON]
    status: active
  - id: FR-RUN-006
    kind: behavioral
    # The scenario property, proven end-to-end at the detect verb seam (fast engine
    # tier, NOT the #75 OOM-flaking docker tier): detected reality -> draft -> reloads
    # as the same PRESENCE set. Versions are best-effort intent the resolver/lockfile
    # re-pins at build (the detect/resolve/lock separation), not a carry-forward gap.
    statement: >-
      the emitted draft is a lossless carry-forward of the machine's PRESENCE set —
      parsing it back yields exactly the tools, agents, and credential names the
      machine detected (exact version pinning is deferred to the resolver/lockfile, as
      everywhere) — proven through the detect verb on a fixture machine in one pass.
    source: SPEC-verbs.md#detect
    tests: [engine.TestDetectEmitPlaybookViaSeam]
    status: active

  # --- The Run, scenario 2 (carry-forward) — detect --migrate (credential MOVE) ---
  # The credential-MOVE half of scenario 2: consolidate detected credentials into a
  # gitignored .env (SPEC-verbs#detect "Credential handling" — frozen, no
  # ALLOW_SPEC_CHANGE). SECURITY-SENSITIVE (it writes secret VALUES to disk) so the
  # build bakes in the spike's guardrails: redacted diff (values never shown/logged),
  # a gitignore refusal guard, --yes consent (never-auto on silence, mirroring
  # teardown), idempotent merge, and a pluggable value source (env -> shell rc files)
  # so a 1Password/Keychain source is a drop-in later. Keychain is OUT of scope (the
  # macOS harness creds live there, not in env/rc — documented, not silently no-op'd).
  # See .scratch/spikes/detect-migrate-env-carry-forward.md (producer-only; the
  # auto-load CONSUMER was rejected — it reopens ADR-0014's leak decision).
  - id: FR-RUN-007
    kind: behavioral
    statement: >-
      detect --migrate consolidates detected credentials into a gitignored .env via a
      pluggable value source (process env first, then shell rc files), ONLY after a
      REDACTED diff (each name marked new/changed/unchanged — secret VALUES are never
      printed, logged, audited, or placed in the --json document) and confirmation
      (interactive [y/N]; non-interactive requires --yes, and on silence/EOF writes
      nothing — never-auto). It refuses to write a literal secret to a .env that a git
      repo does not ignore, merges idempotently (update-in-place/append, other lines
      preserved; an unchanged re-run writes nothing), and leaves detect's frozen --json
      document unchanged. macOS Keychain is out of scope.
    source: SPEC-verbs.md#detect
    tests: [engine.TestMigratePlanRedactsSecretValues, engine.TestMigrateMergeIsIdempotent, engine.TestMigrateRefusesUnignoredEnv, engine.TestMigrateEnvFileMode0600, cli.TestDetectMigrateConfirmAndYes]
    status: active
  - id: FR-RUN-008
    kind: behavioral
    # The 1Password / secret-store on-ramp (the historical T15 "zero token at rest"
    # lean): a .env of op:// references round-trips through --migrate unmangled, so
    # `op run --env-file .env -- loom build` works with NO secret at rest and NO
    # further loom code. References are not secrets, so they are shown in the clear.
    statement: >-
      values that are secret-store REFERENCES (op://...) are treated as opaque
      non-secrets — written verbatim and shown IN THE CLEAR in the diff (not redacted) —
      so migrating a credential whose value is an op:// reference preserves the reference
      exactly, never resolving or masking it.
    source: SPEC-verbs.md#detect
    tests: [engine.TestMigratePassesThroughReferencesUnredacted]
    status: active

  # --- Target Env, devcontainer import (charter scenario 3 / Phase 4, ADR-0003) ---
  # FR-IMPORT-* opens the Target Env workstream (was 0 FRs). Stage-1 deterministic
  # core: ingest devcontainer.json -> a reviewable DRAFT project playbook, reusing the
  # detect --emit-playbook draft-writer pattern (#229). image is REPORTED not mapped
  # (base_image is an engine-level floor, ADR-0012; loom enriches, never degrades-to);
  # features/commands + the AI enrich skill are deferred to later slices.
  - id: FR-IMPORT-001
    kind: behavioral
    statement: >-
      loom import <devcontainer.json> deterministically maps the schema-homed fields into
      a draft project playbook — forwardPorts/appPort -> ports, containerEnv/remoteEnv ->
      env (NAMES only, deduped) — and REPORTS the devcontainer image (loom enriches with
      its own engine-level base per ADR-0012/0003, never mapping image to the playbook)
      while DEFERRING features and commands; every non-mapped field is reported, never
      silently dropped.
    source: SPEC-verbs.md#import
    tests: [engine.TestImportMapsPortsAndEnv, engine.TestImportReportsImageDefersFeaturesCommands, engine.TestImportSanitizesName]
    status: active
  - id: FR-IMPORT-002
    kind: behavioral
    # The scenario property, proven at the import verb seam + CLI tier (no docker):
    # external devcontainer file -> reviewable draft -> validates + feeds plan/build.
    statement: >-
      import writes a DISTINCT draft file (loom.imported.yml in the project root), never
      overwriting an authored loom.yml, that re-parses and validates as a project-tier
      playbook (so build/plan consume it unchanged) — proven through the import verb on a
      devcontainer.json fixture in one pass; import emits human + the documented --json
      shape (source, mapped, reported, deferred, draft) and never mutates beyond the draft.
    source: SPEC-verbs.md#import
    tests: [engine.TestImportDraftValidatesNoClobber, cli.TestImportCLIJSONShape]
    status: active
  - id: FR-IMPORT-003
    kind: behavioral
    # devcontainer.json is canonically JSONC; the parser must tolerate comments +
    # trailing commas WITHOUT the //-inside-a-string footgun (URLs, values).
    statement: >-
      import parses devcontainer.json as JSONC — tolerating // line comments, /* */ block
      comments, and trailing commas — without mis-stripping comment-like sequences inside
      string values (e.g. a URL's //), so the mapping is correct on real devcontainer files.
    source: SPEC-verbs.md#import
    tests: [engine.TestImportStripsJSONCCommentsRespectingStrings]
    status: active
  - id: FR-IMPORT-004
    kind: behavioral
    # features -> tools fits the EXISTING `tools` schema field (no SPEC-playbook change);
    # only the SPEC-verbs clause moved features from DEFERRED -> mapped (ALLOW_SPEC_CHANGE).
    # The version is the feature's `version` OPTION, not the ref tag (devcontainer puts the
    # tool version in the options object; the tag is the feature's own version).
    statement: >-
      import maps RECOGNIZED official devcontainer features
      (ghcr.io/devcontainers/features/<name>) to loom tools via a known feature->tool table
      — name@version when the feature's `version` option is a clean token, else the bare tool
      name, deduped + sorted — and surfaces UNRECOGNIZED/custom features in reported
      (unmapped_features) rather than guessing; `features` thereby leaves the DEFERRED set
      (only `commands` remains deferred).
    source: SPEC-verbs.md#import
    tests: [engine.TestImportMapsKnownFeaturesToTools, engine.TestImportReportsUnknownFeatures, engine.TestImportFeatureNameBoundary, engine.TestImportMultiToolFeatureBareNames]
    status: active

  # --- AI-first invariants (RULES §5; global, parametrized suite) ---
  # start is a mutating verb subject to the invariants (NOT --json-exempt), so it
  # is added to the covers: list of each suite. start's mutation IS its build call,
  # already exercised by the build entries; the orchestration shape is conformance-
  # checked (TestSpecConformance now runs start) and idempotency rides build's.
  - id: FR-INV-001
    kind: invariant
    statement: every verb emits human plus --json output.
    source: RULES.md#§5
    tests: { suite: cli.TestSpecConformance, covers: [detect, plan, build, start, teardown] }
    status: active
  - id: FR-INV-002
    kind: invariant
    statement: every mutating verb is audit-logged and diagnostic-logged.
    source: RULES.md#§5
    tests: { suite: engine.TestMutatingVerbsAreObservable, covers: [build, teardown, start] }
    status: active
  - id: FR-INV-003
    kind: invariant
    statement: every mutating verb is idempotent; re-running converges.
    source: RULES.md#§5
    tests: { suite: engine.TestMutatingVerbsIdempotent, covers: [build, teardown, start] }
    status: active
  - id: FR-INV-004
    kind: invariant
    statement: the unit gate is hermetic; same result regardless of host tooling/env (local equals CI).
    source: RULES.md#§5
    tests: [guard.TestGateIsHermetic]
    status: active

  # --- Guardrails (per-hook; test = the hook's full pattern suite) ---
  - id: FR-GUARD-BASH
    kind: guardrail
    # Phase-1 review H3/H4: fixed substrings fell to spacing tricks and
    # alternate tools; hook-path redirects, credential reach, and raw-socket /
    # interpreter one-liner egress were unmatched entirely.
    # T29 (envelope 046, red-teamed): evaluation is segment-aware two-pass
    # fail-closed — per-segment on certain splits (shared splitter:
    # segment-split), whole-line legacy always (the deny match set never
    # shrinks; cross-segment hits block WITH a trace marker), indirection
    # conjunction for assignment+expansion. Licensed re-anchorings:
    # recursive-delete on path root; force-push within one logical command
    # (gaining flag-order coverage) — each pinned by a was-false-blocking
    # regression.
    statement: guard-bash blocks its defined class of dangerous bash — including whitespace-normalized variants, alternate privilege tools, case-folded core.hooksPath redirects, credential-file reach, /dev/tcp + interpreter one-liner egress, root-anchored recursive deletes, segment-anchored force-pushes in any flag order, and assignment+expansion force-push indirection — and allows benign commands, including the two 2026-06-12 false-block specimens.
    source: [RULES.md#§5, config/hooks/guard-bash, config/hooks/segment-split]
    tests: { suite: guard.TestGuardBashBlocksDangerousAllowsBenign + guard.TestGuardBashBlocksBypassClasses + guard.TestT29WasFalseBlockingSpecimens + guard.TestT29DenyFloorNeverShrinks + guard.TestT29SegmentAnchoredGainsFlagOrder + guard.TestT29IndirectionTaint, patterns: all }
    status: active
  - id: FR-GUARD-BRANCH
    kind: guardrail
    statement: branch-guard blocks commits on main and allows the audited override and feature branches.
    source: [RULES.md#§1, config/hooks/branch-guard]
    tests: { suite: guard.TestBranchGuardBlocksMainAllowsOverrideAndBranch, patterns: all }
    status: active
  - id: FR-GUARD-PROTECT-PATHS
    kind: guardrail
    statement: protect-paths blocks staged frozen-contract changes absent an audited override.
    source: [RULES.md#§2, config/hooks/protect-paths]
    tests: { suite: guard.TestProtectPathsBlocksFrozenContract, patterns: all }
    status: active
  - id: FR-GUARD-TRUST-CONFIG
    kind: guardrail
    # Envelope 040 / 029.B (T28, C1-family): trust-config edits are human-only
    # (029.C); this is the git-side half of the protection. The two override
    # classes never cross-unlock — a spec authorization is not a guardrail
    # authorization. The harness-side half (Edit/Write deny rules) is itself a
    # settings change and therefore human-only — tracked on the queue row.
    statement: protect-paths blocks staged changes to trust config (.claude/settings*.json, .claude/hooks/**) absent the audited ALLOW_TRUST_CHANGE override; ALLOW_SPEC_CHANGE does not unlock trust config nor vice versa; .claude/skills/** stays unprotected.
    source: [RULES.md#§5, config/hooks/protect-paths]
    tests: { suite: guard.TestProtectPathsBlocksTrustConfig, patterns: all }
    status: active
  - id: FR-GUARD-RESURFACE
    kind: guardrail
    # ADR-0020 / R2 (same doctrine as the wake-keystroke constant): parked-on is
    # an AGENT-WRITTEN field; the drain re-surface decision must NEVER pass it to
    # a shell. config/hooks/resurface-decide uses a fixed predicate vocabulary
    # dispatched to handlers that open files (awk getline) or compare validated
    # strings — never eval. The author slice; the trust-path drain diff that
    # sources it is human-applied (PR #137).
    statement: resurface-decide never passes a parked-on predicate value to a shell — fixed vocabulary only (exists:/pr-merged:/item-status:), unknown kind / malformed value / a field after status: all fail-closed (stay PARKED or ESCALATE, never RESURFACE), and a ${IFS} shell-injection payload in parked-on creates no file.
    source: [docs/decisions/0020-autonomy-closed-loop.md, config/hooks/resurface-decide]
    tests: { suite: guard.TestResurfaceDecide, patterns: all }
    status: active
  - id: FR-GUARD-E2E
    kind: behavioral
    # The meta-guardrail over the role-deny guards. Every guard defect this
    # session was caught by hand, in-container, by a human — never by CI:
    # #190 (registered in settings.json but absent from harness.hooks, so NEVER
    # materialized), #192/LL-016 (exited 1 not 2 — a non-blocking error, the tool
    # still ran), #189/#194/LL-017 (PreToolUse delivers tool input as JSON on
    # STDIN, not argv, so space-bounded token rules matched the JSON blob and were
    # INERT). Unit tests (`sh hook <arg>`) cannot catch any of these — they never
    # touch the materialized file, the built container, the JSON-on-stdin shape,
    # or role resolution. This FR makes the in-container proof a CI GATE, not a
    # manual step. The fixture guards are byte-pinned to config/hooks/ by
    # engine.TestGuardFixtureParity so the e2e can never certify a stale guard.
    statement: Every role-scoped deny guard (role-push-guard, spawn-guard, and any future PreToolUse role-narrowing hook) has an integration-tier (docker-backed, //go:build integration) e2e that drives the MATERIALIZED ~/.claude/hooks/<guard> in the BUILT container via the REAL PreToolUse path — tool-input JSON on STDIN, role from LOOM_SESSION_ROLE/marker — and asserts the denied role is BLOCKED (exit 2) and the privileged role is ALLOWED (exit 0) for every command class the guard narrows, plus that each guard file is materialized executable (the #190 class) and benign commands are not over-blocked. Unit tests that invoke `sh hook <arg>` are necessary but NOT sufficient.
    source: [RULES.md#§5, config/hooks/role-push-guard, config/hooks/spawn-guard]
    tests: { suite: engine.TestE2EGuardsBlockByRole + engine.TestGuardFixtureParity, patterns: all }
    status: active

  # --- Behavioral: autonomy closed-loop (ADR-0020) ---
  - id: FR-LOOP-001
    kind: behavioral
    # ADR-0020: a block never halts-and-drops. The drain decides each item's
    # disposition; pull-next keeps the Writer moving without priority inversion.
    # The trust-path drain-hook wiring is human-applied (PR #137); these scripts
    # + tests are the author slice that GATES that application.
    statement: the closed-loop disposes each inbox item — DELIVER (QUEUED) / SKIP-PARKED (dep uncleared) / RESURFACE (dep cleared) / ESCALATE (parked past LOOM_MAX_PARK_AGE, never auto-dropped) / SKIP-SUPERSEDED — and pull-next selects the first QUEUED item whose depends-on is empty or DONE, skipping any depending on a PARKED/QUEUED item (no priority inversion); an all-blocked inbox yields no pick.
    source: docs/decisions/0020-autonomy-closed-loop.md
    tests: [guard.TestResurfaceDecide, guard.TestPullNextNoPriorityInversion]
    status: active

  # --- Behavioral: autonomy substrate (ADR-0022 slices 1-4 + ADR-0025 reaper) ---
  # T34 slice-5 wiring: the offline substrate decision scripts (scripts/) HAD guard
  # tests but no FR row tying each to its ADR clause. These close the spec->FR->test
  # joint over the substrate so make fr-verify covers it. Ordinary code this slice
  # (scripts stay in scripts/); relocation under config/hooks/ behind protect-paths
  # is the HUMAN trust-path half. Each also pins the opt-in external-truth integrity
  # check (LOOM_EXTERNAL_TRUTH_STRICT) where it is security-load-bearing.
  - id: FR-LOOP-002
    kind: behavioral
    # ADR-0022 amendments 2 + 3 / Decision 3: the offline READINESS-RUNNER. Deps by
    # EXTERNAL TRUTH only (never agent-forgeable commit subjects — the S1 blocker);
    # exec-readiness by a structured tag, not a heuristic; injection-proof fixed vocab.
    statement: readiness-decide resolves a queued candidate row's deps ONLY against the external-truth merged-refs file ($2) — a PR cited in row prose but absent from that file yields BLOCKED-DEPS (agent-forgeable commit subjects are never consulted) — gates exec-readiness on the structured [class:exec] tag (absent ⇒ NOT-EXEC-READY), emits only hardcoded fixed-vocab verdicts with row text never reaching a shell, and under LOOM_EXTERNAL_TRUTH_STRICT=1 fails closed to BLOCKED-DEPS when the merged-refs file is writable by the running process (default unset ⇒ unchanged).
    source: [docs/decisions/0022-autonomy-substrate-ephemeral-worker-backlog-pull.md, scripts/readiness-decide]
    tests: [guard.TestReadinessDecide, guard.TestReadinessDecideMissingMergedFile, guard.TestReadinessDecideExternalTruthStrict]
    status: active
  - id: FR-LOOP-003
    kind: behavioral
    # ADR-0022 slice 2 / amendment 5 (Decision 3e): the backlog->inbox REFILL
    # actuator. Self-selection floor (LOOM_AUTOPULL_CLASSES) distinct from the
    # never-auto permission floor; supersede-aware; idempotent; rehydration-safe body.
    statement: promote-next mints at most one parser-valid inbox envelope for the single READY backlog row — idempotently (a second run no-ops) and supersede-aware (a SUPERSEDED row never mints) — where the self-selection floor is the LOOM_AUTOPULL_CLASSES allow-list (a row whose class is off it, default empty, mints status CONFIRM-REQUIRED for the human tier; on it mints QUEUED), and the minted body is a fixed template that never echoes raw row prose as an instruction.
    source: [docs/decisions/0022-autonomy-substrate-ephemeral-worker-backlog-pull.md, scripts/promote-next]
    tests: [guard.TestPromoteNextOnlyReadyMints, guard.TestPromoteNextSelfSelectionFloor, guard.TestPromoteNextIdempotent, guard.TestPromoteNextSupersededNeverMints, guard.TestPromoteNextInjectionProof, guard.TestPromoteNextFullKeyServes]
    status: active
  - id: FR-LOOP-004
    kind: behavioral
    # ADR-0022 slice 4 (adv-074 self-wake re-frame): the OFFLINE WAKE ORCHESTRATOR
    # + its self-wake-tick wrapper. HALT-first; refill->guard chain; bounded
    # self-poll (give-up after K empty ticks); cadence clamp [60,3600]; fixed vocab.
    statement: the self-wake orchestrator is HALT-first (a HALT sentinel ⇒ NO-WAKE, refilling/recording/ticking nothing), else runs the readiness-decide→promote-next→spawn-guard chain and emits one fixed-vocab verdict (WAKE / WAKE-POLL / WAKE-BACKOFF / IDLE-STOP / NO-WAKE); the self-poll is bounded — it gives up (IDLE-STOP, no re-arm) after LOOM_WAKE_MAX_EMPTY consecutive empty ticks and clamps every emitted delay into [60,3600]s — and self-wake-tick wraps it with the seat's standard paths, surfacing the verdict verbatim.
    source: [docs/decisions/0022-autonomy-substrate-ephemeral-worker-backlog-pull.md, scripts/spawn-loop, scripts/self-wake-tick]
    tests: [guard.TestSpawnLoop, guard.TestSpawnLoopCadenceClamp, guard.TestSpawnLoopFixedVocab, guard.TestSelfWakeTick]
    status: active
  - id: FR-GUARD-SPAWN-RATE
    kind: behavioral
    # ADR-0022 slice 3 (Decision 4, amendment 1): the DURABLE cross-spawn rate
    # ledger + HALT-before-spawn. NOTE: this is scripts/spawn-guard (the rate
    # ledger), DISTINCT from config/hooks/spawn-guard (the role-deny PreToolUse hook
    # covered by FR-GUARD-E2E). Behavioral (a decision-helper), so FR-GUARD-* / kind
    # behavioral, like FR-GUARD-E2E.
    statement: the ADR-0022 slice-3 cross-spawn rate ledger (scripts/spawn-guard, distinct from the role-deny PreToolUse hook of the same name) grants ALLOW and records exactly one ledger line only when HALT is absent and in-window grants are under LOOM_SPAWN_MAX; it is HALT-first (DENY-HALT, no append) and fails closed to DENY-RATE with no append at/over the limit or on a malformed/unreadable ledger; under LOOM_EXTERNAL_TRUTH_STRICT=1 it also fails closed to DENY-RATE when the ledger is writable by the running process (default unset ⇒ unchanged).
    source: [docs/decisions/0022-autonomy-substrate-ephemeral-worker-backlog-pull.md, scripts/spawn-guard]
    tests: [guard.TestSpawnGuard, guard.TestSpawnGuardExternalTruthStrict]
    status: active
  - id: FR-GUARD-REAP
    kind: behavioral
    # ADR-0025 §reaper / Slice D1: the dead-worker cleanup decision. The INVERSION
    # of spawn-guard — it fails SAFE (ambiguity ⇒ SKIP, never a destructive reap).
    # PARK linkage to resurface-decide is ADR-0020 (worker-died: never auto-clears).
    statement: reap-workers decides per dead worker REAP-CLEAN (no claim ⇒ tombstone) or REAP-REQUEUE (held claim ⇒ a parser-valid PARK envelope resurface-decide surfaces to a human, never silently re-run), is HALT-first and idempotent (an existing reap-marker ⇒ SKIP-REAPED), and fails SAFE — every ambiguity (live/only-stale heartbeat, no ledger start, not past max-age, malformed worker-id or claim) resolves to SKIP and never to a destructive reap — with fixed-vocab verdicts and validated ids keeping worktree names out of any shell.
    source: [docs/decisions/0025-author-ephemeral-fleet.md#reaper, docs/decisions/0020-autonomy-closed-loop.md, scripts/reap-workers]
    tests: [guard.TestReapSkipHalt, guard.TestReapSkipLive, guard.TestReapClean, guard.TestReapRequeue, guard.TestReapIdempotent, guard.TestReapFailSafe, guard.TestReapInjection]
    status: active

  # --- Schema / resolution (SPEC-playbook; one per merge/resolution rule) ---
  - id: FR-SCHEMA-001
    kind: schema
    statement: layer merge order is base->stack->overlay, later-wins for whole files.
    source: SPEC-playbook.md#layer-resolution
    tests: [playbook.TestLoadMergesLayers, playbook.TestMergeScalarLastNonEmptyWins]
    status: active
  - id: FR-SCHEMA-002
    kind: schema
    statement: lists concatenate and dedup across layers (rules union is this rule applied to rules).
    source: SPEC-playbook.md#layer-resolution
    tests: [playbook.TestMergeListsConcatAndDedup]
    status: active
  - id: FR-SCHEMA-003
    kind: schema
    statement: an empty or absent later scalar does not clobber an earlier value.
    source: SPEC-playbook.md#layer-resolution
    tests: [playbook.TestMergeEmptyScalarDoesNotClobber]
    status: active
  - id: FR-SCHEMA-004
    kind: schema
    statement: YAML is authored; JSON is also accepted on input (parser reads either).
    source: SPEC-playbook.md#frozen-decisions
    tests: [playbook.TestParseYAMLAndJSONAgree]
    status: active
  - id: FR-SCHEMA-005
    kind: schema
    statement: the lockfile records per-tool (intent/resolved/digest/source) AND the base-image digest.
    source: SPEC-playbook.md#lockfile
    tests: [resolver.TestResolutionToLock, lock.TestWriteReadRoundTrip, engine.TestBuildPinsBaseDigest]
    status: active
  - id: FR-SCHEMA-006
    kind: schema
    statement: config source resolves a local tree, rejects path-escape, and rejects unsupported types (git is Phase 2).
    source: SPEC-playbook.md#base-playbook
    tests: [source.TestResolveLocalReadsTree, source.TestResolvePathEscapeRejected, source.TestResolveGitUnsupported, source.TestResolveUnknownType]
    status: active
  - id: FR-SCHEMA-007
    kind: schema
    statement: dotfiles resolve by layer; a later tier referencing the same target path replaces the earlier file (whole-file).
    source: SPEC-playbook.md#layer-resolution
    tests: [engine.TestDotfilesLaterTierReplacesSameTarget]
    status: active

  # --- Logs (SPEC-verbs action log + diagnostic log, ADR-0010) ---
  - id: FR-LOG-001
    kind: behavioral
    statement: mutating verbs append one structured audit entry per mutation (the action log).
    source: SPEC-verbs.md#action-log
    tests: [audit.TestAppendWritesJSONLAndIDs, audit.TestOpenContinuesSequence, engine.TestMutatingVerbsAreObservable]
    status: active
  - id: FR-LOG-002
    kind: behavioral
    statement: mutating verbs produce a per-verb diagnostic log.
    source: SPEC-verbs.md#diagnostic-log
    tests: [engine.TestMutatingVerbsAreObservable]
    status: active
