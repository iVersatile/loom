loom: 1
tier: project
name: loom

extends: base
stack: go
overlay: loom

# Project-specific tools on top of the go stack defaults.
# make: the gate's one entry point (RULES §7) is `make gate` — the container
# must be able to run its own repo's pre-commit hook.
tools:
  - go@1.26
  - make

rules:
  - loom/project

# Loom-role identity → the root-owned /var/lib/loom/role marker `loom build`
# writes (T10/ADR-0019 PR4 §5, LL-014: declarative + in-tree, never a host hack).
# loom-author is the primary autonomy seat; the advisor seat overrides per build
# with LOOM_SESSION_ROLE=loom-advisor (the demoted env, kept as the per-seat
# override / test-seam). After PR4 Part 2 lands, the drain role-guard reads this
# marker instead of the forgeable `id -un==root` guess. Conceptual home: ADR-0021.
role: loom-author

# Provisioned role set (T34 Slice E / FR-SCHEMA-011, #200) — DECLARATIVE only:
# loom-dev is provisioned to act as BOTH seats (the supervisor's home is loom-dev,
# ADR-0025). This does NOT change the trust marker (`role:` above stays the
# fail-closed default loom-author); the advisor seat still elevates per-session via
# LOOM_SESSION_ROLE=loom-advisor. The marker ceiling + absent-signal floor are a
# co-dependent matched pair deferred to the co-residence slice (D) — never set the
# marker from this list. See OPEN-THREADS T34.
roles:
  - loom-author
  - loom-advisor

# Runtime user (T10/ADR-0019 Model A, PR4 Part 3): loom-dev runs the agent SESSION
# as the non-root `loom` user (entry verbs `exec -u loom`), making the root-owned
# /var/lib/loom/role marker TRULY non-forgeable — a non-root agent reads but cannot
# write it (ADR-0022 S3 caveat closed; the spawner, slice 4, needs this). The
# container itself still runs as root (Model A); this is the per-entry-verb identity.
# useradd prefers uid 1000, matching the bind-mounted workspace owner (uid 1000) so
# .scratch/inbox stays writable and the drain keeps flipping statuses. The drain
# role-guard already resolves via the marker (PR4 Part 2), so going non-root is safe
# (the old id -un==root fallback is gone — that was the load-bearing ordering).
user: loom

env:
  - ANTHROPIC_API_KEY

ci:
  - ci

# Harness trust/opt-in flags (SPEC-playbook#harness `trust:`, 036 ruling,
# ADR-0018): ~/.claude.json is an overlay SIBLING of the mounted agent home —
# it dies on container recreate, costing a manual trust re-flip per restart
# (flips.log, T23). Declared here because trust posture is project-tier; the
# declared file is the playbook's, the rest of the live ~/.claude.json is
# rederivable cache. Trust changes ship as edits to this declaration.
harness:
  claude:
    trust: claude/trust.json

config_source:
  type: local
  path: ./config
