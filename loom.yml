loom: 1
tier: project
name: loom

extends: base
stack: go
overlay: loom

# Project-specific tools on top of the go stack defaults.
# make: the gate's one entry point (RULES §7) is `make gate` — the container
# must be able to run its own repo's pre-commit hook.
tools:
  - go@1.26
  - make

rules:
  - loom/project

env:
  - ANTHROPIC_API_KEY

ci:
  - ci

# Harness trust/opt-in flags (SPEC-playbook#harness `trust:`, 036 ruling,
# ADR-0018): ~/.claude.json is an overlay SIBLING of the mounted agent home —
# it dies on container recreate, costing a manual trust re-flip per restart
# (flips.log, T23). Declared here because trust posture is project-tier; the
# declared file is the playbook's, the rest of the live ~/.claude.json is
# rederivable cache. Trust changes ship as edits to this declaration.
harness:
  claude:
    trust: claude/trust.json

config_source:
  type: local
  path: ./config
