loom: 1
tier: base

# Agent harnesses available in every project's container.
# gemini (gemini-cli) is a FULL PEER of claude-code (same tier): installed via
# npm (needs the nodejs tool below), authed by the volume-token credential
# (GEMINI_API_KEY), and command-guarded by harness.gemini.settings (the tightest
# deny the tool supports — see the loud caveat there). agentInstallCmd installs
# it; agentSource maps it to npm-global.
agents:
  - claude-code
  - gemini

# Tools shared across all projects.
# golangci-lint: a `make gate` dependency (Makefile hard-fails lint without it);
# undeclared it only ever existed by accident (OPEN-THREADS T19).
tools:
  - git
  - jq
  - ripgrep
  - gitleaks
  - golangci-lint
  # nodejs: Node.js 20 + npm — the PREREQUISITE for gemini-cli (installed via
  # `npm i -g @google/gemini-cli`; gemini-cli's package.json pins Node >= 20).
  # debian:bookworm-slim's apt nodejs is v18 (too old), so this resolves to the
  # `nodejs-20` source (the official NodeSource setup script), NOT apt — see
  # resolver.sourcePolicy + provisionScript. claude-code needs NO Node (native
  # installer); this entry exists solely for the gemini peer.
  - nodejs
  # gh: env-tier git-controller/VCS capability for the seat (advisor-in-loom
  # T34, Slice B) — backs the `!gh auth git-credential` helper. go-install
  # source (loom-dev has the Go toolchain); see resolver sourcePolicy +
  # engine goModule.
  - gh

rules:
  - common/safety

# Env-wide $HOME config materialized into every container (survives rebuild).
# claude/settings.json moved to harness.claude.settings below — one owner per
# target; it is harness config (hook registrations, permission floor), not a
# plain dotfile.
dotfiles:
  - claude/statusline.sh
  # Declared git identity -> ~/.gitconfig (T16 PR 3; harness config by
  # weight, plain dotfile by shape — SPEC-playbook#shell-config sibling
  # rule). Must declare the noreply identity (TEAM.md); doctor verifies
  # completeness (host:gitconfig).
  - gitconfig

# Guardrails enforced by mechanism (ADR-0005), not trust — plus
# checkpoint-inject: continuity mechanism rather than guardrail, listed here
# so doctor verifies it the same way (present + executable) — cold-start
# recovery must not silently rot (envelope 042, T28-A).
hooks:
  - guard-bash
  - branch-guard
  - protect-paths
  - checkpoint-inject
  - role-inject # SessionStart: surfaces the resolved seat (LOOM_SESSION_ROLE/marker)
  # THE shared segment splitter (T29 amendment 5: one splitter, or they
  # drift) — a sourced library, not an event hook: guard-bash sources it,
  # allow-compound adopts it; listed so doctor verifies it ships next to
  # the hooks that source it.
  - segment-split

# Harness-home config (SPEC-playbook#harness, ADR-0015): declared by
# reference, materialized into the agent home (~/.claude) on every build via
# the dotfiles staging pipeline (T7 digest covers it). settings.json carries
# its own hook registrations — the engine never synthesizes them. It sets NO
# defaultMode: trust level is project-tier (the T22 trial owns it today).
# branch-guard/protect-paths stay git-side guardrails (.githooks);
# guard-bash (PreToolUse) and checkpoint-inject (SessionStart, envelope 042
# T28-A triad) carry harness-event semantics and materialize into the agent
# home. session-snapshot is not declared: its content design is parked
# (judgment-trial C4).
harness:
  # gemini (gemini-cli) — a FULL PEER of claude, at the same tier. Mirrors the
  # claude STRUCTURE (settings + credential), NOT claude's claude-specific hooks:
  # gemini-cli has a DIFFERENT config schema (~/.gemini/settings.json) and — to
  # the best of current knowledge (Jan 2026 cutoff; web unavailable at build) —
  # NO PreToolUse-equivalent script hook that can inspect command CONTENT and
  # block on exit code the way guard-bash does. So gemini's command deny-floor is
  # carried ENTIRELY by settings.json `excludeTools` (prefix-scoped denials; the
  # verified gemini-cli key), NOT
  # by a hooks: list here (a gemini hooks: list would dangle — there is no gemini
  # hook mechanism to register it into). See the loud SECURITY caveat in
  # config/dotfiles/gemini/settings.json.
  #
  # credential: volume-token (M1, ADR-0027) injects GEMINI_API_KEY at EXEC time
  # from the per-project credential volume — same leak-safe adapter claude's docs
  # describe, the path T15 slice 1 reserved for gemini (OAuth/ADC is DEFERRED —
  # NOT built here). gemini is the only volume-token agent, so the slice-1
  # "first sorted M1 agent" injection selects it cleanly (claude uses the host
  # creds mount, no credential: block).
  gemini:
    settings: gemini/settings.json
    credential:
      method: volume-token
      env: GEMINI_API_KEY
  claude:
    settings: claude/settings.json
    hooks:
      - guard-bash
      - checkpoint-inject
      - role-inject # SessionStart (registered in settings.json alongside
        # checkpoint-inject): surfaces the resolved seat (LOOM_SESSION_ROLE/marker)
        # so the agent never infers its role from docs. MUST be in this list or it
        # is never materialized (LL-016/#190).
      - segment-split # must land NEXT TO guard-bash (dirname-relative source)
      - role-push-guard # T34 Slice A: settings.json registers it as a PreToolUse
        # hook; it MUST be in this list or it is never materialized into
        # ~/.claude/hooks (A1 #189 defect). Sources segment-split (same dir).
      - spawn-guard # T34 Slice D: closes role-push-guard's re-exec residual by
        # denying `claude` (agent spawn) for non-advisor sessions. settings.json
        # registers it as a PreToolUse hook; it MUST be in this list or it is
        # never materialized (LL-016 / #190). Sources segment-split (same dir).
    skills:
      - import-enrich # T37 Stage-3: the AI-judgment layer over `loom import`
        # (ADR-0003 "import & enrich"). Materialized to ~/.claude/skills/; an agent
        # runs it on a loom.imported.yml draft to map features->tools, infer the
        # stack, and surface commands as notes. Prose only — not a verb, not FR-
        # covered (skills are instructions, not contracts; the engine never shells
        # to claude -p — ADR-0022/spawn-guard). loom's FIRST product skill.
