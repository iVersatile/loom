loom: 1
tier: base

# Agent harnesses available in every project's container.
agents:
  - claude-code

# Tools shared across all projects.
# golangci-lint: a `make gate` dependency (Makefile hard-fails lint without it);
# undeclared it only ever existed by accident (OPEN-THREADS T19).
tools:
  - git
  - jq
  - ripgrep
  - gitleaks
  - golangci-lint

rules:
  - common/safety

# Env-wide $HOME config materialized into every container (survives rebuild).
# claude/settings.json moved to harness.claude.settings below — one owner per
# target; it is harness config (hook registrations, permission floor), not a
# plain dotfile.
dotfiles:
  - claude/statusline.sh

# Guardrails enforced by mechanism (ADR-0005), not trust.
hooks:
  - guard-bash
  - branch-guard
  - protect-paths

# Harness-home config (SPEC-playbook#harness, ADR-0015): declared by
# reference, materialized into the agent home (~/.claude) on every build via
# the dotfiles staging pipeline (T7 digest covers it). settings.json carries
# its own hook registrations — the engine never synthesizes them. It sets NO
# defaultMode: trust level is project-tier (the T22 trial owns it today).
# branch-guard/protect-paths stay git-side guardrails (.githooks); only
# guard-bash has harness-event semantics (PreToolUse). session-snapshot is
# not declared: its content design is parked (judgment-trial C4).
harness:
  claude:
    settings: claude/settings.json
    hooks:
      - guard-bash
